name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show build environment
        run: |
          node -v
          npm -v
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ==========================================
      # Extract project
      # ==========================================
      - name: Unpack project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o app.zip -d project

          echo "=========================================="
          echo "Extracted files"
          echo "=========================================="

          find project -maxdepth 4 -type f | head -150

          echo "=========================================="
          echo "Searching for package.json"
          echo "=========================================="

          PACKAGE_JSON=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found inside app.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # Firebase
      # ==========================================
      - name: Add optional account settings
        run: |
          if [ -f firebase-config.js ]; then
            mkdir -p "$PROJECT_DIR/www"
            cp firebase-config.js "$PROJECT_DIR/www/firebase-config.js"
            echo "Firebase/account settings added"
          else
            echo "No firebase-config.js found - accounts stay off"
          fi

      # ==========================================
      # Quran
      # ==========================================
      - name: Download Quran text
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          curl --retry 3 -fsSL \
            https://api.alquran.cloud/v1/quran/quran-uthmani \
            -o quran-raw.json

          if [ -f scripts/prep-quran.js ]; then
            node scripts/prep-quran.js
          else
            echo "prep-quran.js not found - skipping"
          fi

      # ==========================================
      # Create Android project
      # ==========================================
      
      - name: Create Android project and configure AdMob
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Installing dependencies..."
          npm install

          echo "Installing AdMob for Capacitor 6..."
          npm install @capacitor-community/admob@6

          echo "Creating Android project..."
          npx cap add android

          echo "Patching Android..."
          if [ -f scripts/patch-android.js ]; then
            node scripts/patch-android.js
          fi

          echo "Syncing Capacitor..."
          npx cap sync android

          echo "Configuring AdMob..."
          python3 -c '
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          c = p.read_text(encoding="utf-8")

          admob = """        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6630383601701998~1024264367"/>
          """

          if "com.google.android.gms.ads.APPLICATION_ID" not in c:
              c = c.replace("</application>", admob + "    </application>")
              p.write_text(c, encoding="utf-8")

          print("AdMob configuration complete.")
          '

          echo "Android project ready."
