name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Unpack project
        run: unzip -o app.zip -d project
      - name: Create the Android project and build APK
        run: |
          PKG_PATH=$(find project -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "package.json not found inside project/"
            find project -maxdepth 3
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Using project directory: $APP_DIR"
          cd "$APP_DIR"
          npm install
          npm install @capacitor-community/admob
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
          export ANDROID_COMPILE_SDK_VERSION=35
          export ANDROID_TARGET_SDK_VERSION=35
          python3 -c '
          import glob, re
          files = glob.glob("android/**/*.gradle", recursive=True) + glob.glob("android/**/*.gradle.kts", recursive=True)
          for rel in files:
              try:
                  with open(rel, "r", encoding="utf-8") as f:
                      txt = f.read()
                  orig = txt
                  txt = re.sub(r"(compileSdk(?:Version)?\s*(?:=|\s)\s*)\d+", r"\g<1>35", txt)
                  txt = re.sub(r"(targetSdk(?:Version)?\s*(?:=|\s)\s*)\d+", r"\g<1>35", txt)
                  txt = re.sub(r"(compileSdkVersion\s*=\s*)\d+", r"\g<1>35", txt)
                  txt = re.sub(r"(targetSdkVersion\s*=\s*)\d+", r"\g<1>35", txt)
                  if txt != orig:
                      with open(rel, "w", encoding="utf-8") as f:
                          f.write(txt)
                      print("Updated:", rel)
                  for line in txt.splitlines():
                      if "compileSdk" in line or "targetSdk" in line:
                          print(rel, "->", line.strip())
              except Exception as e:
                  print("Skip:", rel, e)
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              c = f.read()
          meta = """        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6630383601701998~1024264367"/>\n    </application>"""
          if "com.google.android.gms.ads.APPLICATION_ID" not in c:
              c = c.replace("</application>", meta)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(c)
          '
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-apk
          path: app-debug.apk
