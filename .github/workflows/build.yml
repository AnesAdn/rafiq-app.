name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Show build environment
        run: |
          node -v
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Unpack project
        run: unzip -o app.zip -d project
      - name: Add optional account settings
        run: |
          if [ -f firebase-config.js ]; then cp firebase-config.js project/www/firebase-config.js; echo "account settings added"; else echo "no firebase-config.js - accounts stay off"; fi
      - name: Download Quran text for the offline reader
        working-directory: project
        continue-on-error: true
        run: |
          curl --retry 3 -fsSL https://api.alquran.cloud/v1/quran/quran-uthmani -o quran-raw.json
          node scripts/prep-quran.js
      - name: Create the Android project and configure AdMob
        working-directory: project
        run: |
          npm install
          npm install @capacitor-community/admob
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
          python3 -c '
          import glob, re
          files = glob.glob("android/**/*.gradle", recursive=True) + glob.glob("android/**/*.gradle.kts", recursive=True)
          for rel in files:
              try:
                  with open(rel, "r", encoding="utf-8") as f:
                      txt = f.read()
                  orig = txt
                  txt = re.sub(r"(compileSdk(?:Version)?\s*(?:=|\s)\s*)\d+", r"\g<1>35", txt)
                  txt = re.sub(r"(targetSdk(?:Version)?\s*(?:=|\s)\s*)\d+", r"\g<1>35", txt)
                  txt = re.sub(r"(minSdk(?:Version)?\s*(?:=|\s)\s*)2[0-2]\b", r"\g<1>23", txt)
                  if txt != orig:
                      with open(rel, "w", encoding="utf-8") as f:
                          f.write(txt)
              except Exception:
                  pass
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r", encoding="utf-8") as f:
              c = f.read()
          meta = """        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6630383601701998~1024264367"/>\n    </application>"""
          if "com.google.android.gms.ads.APPLICATION_ID" not in c:
              c = c.replace("</application>", meta)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(c)
          '
      - name: Build signed release APK
        working-directory: project/android
        env:
          KS_PASS: "-_LTGZDyMnsoFFci"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/project/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=rafiq \
            -Pandroid.injected.signing.key.password="$KS_PASS" \
          || ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-apk-v4
          path: project/android/app/build/outputs/apk/**/*.apk
          
