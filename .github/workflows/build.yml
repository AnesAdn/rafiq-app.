
name: Build Rafiq Al-Muslim APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Unpack project
        run: |
          set -e
          mkdir -p project
          unzip -o app.zip -d project

          PACKAGE_JSON=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Replace Test Ad ID with Real Ad ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")

          test_ids = [
              "ca-app-pub-3940256099942544/6300978111",
              "ca-app-pub-3940256099942544"
          ]

          real_id = "ca-app-pub-6630383601701998/7337411339"

          count = 0

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if any(x in p.parts for x in ["node_modules", ".git"]):
                  continue

              try:
                  content = p.read_text(encoding="utf-8")
                  original = content

                  for test_id in test_ids:
                      content = content.replace(test_id, real_id)

                  if content != original:
                      p.write_text(content, encoding="utf-8")
                      print("Updated:", p)
                      count += 1

              except (UnicodeDecodeError, OSError):
                  pass

          print("Files updated:", count)

          if count == 0:
              print("WARNING: Test Ad ID not found.")
          PY

      - name: Fix Capacitor package ID
        working-directory: project
        run: |
          set -e

          CONFIG=$(find . -type f -name "capacitor.config.json" -print -quit)

          if [ -z "$CONFIG" ]; then
            echo "ERROR: capacitor.config.json not found"
            exit 1
          fi

          python3 - "$CONFIG" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          config["appId"] = "com.muslimpartnerstudio.rafiqalmuslim"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          print("Package ID updated successfully")
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npm install
          npm install @capacitor-community/admob@6

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          npx cap add android

          if [ -f scripts/patch-android.js ]; then
            node scripts/patch-android.js
          fi

          npx cap sync android

      - name: Configure AdMob
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          c = p.read_text(encoding="utf-8")

          admob = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6630383601701998~1024264367"/>\n'

          if "com.google.android.gms.ads.APPLICATION_ID" not in c:
              c = c.replace("</application>", admob + "    </application>")
              p.write_text(c, encoding="utf-8")

          print("AdMob configured")
          PY

      - name: Build installable APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          cd android
          chmod +x gradlew

          ./gradlew assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find app/build/outputs -type f
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/rafiq-almuslim.apk"

          echo "APK created successfully"
          ls -lh "$GITHUB_WORKSPACE/rafiq-almuslim.apk"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="test-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/rafiq-almuslim.apk" \
            --title "Rafiq Al-Muslim Test ${GITHUB_RUN_NUMBER}" \
            --notes "Installable debug APK for testing"
