name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Unpack project
        run: unzip -o app.zip -d project
      - name: Create the Android project
        working-directory: project
        run: |
          npm install
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-almuslim-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
