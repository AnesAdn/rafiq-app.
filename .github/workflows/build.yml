name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Unpack project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o app.zip -d project

          PACKAGE_JSON=$(find project -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download Quran
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          curl --retry 3 -fsSL \
            https://api.alquran.cloud/v1/quran/quran-uthmani \
            -o quran-raw.json

          if [ -f scripts/prep-quran.js ]; then
            node scripts/prep-quran.js
          fi

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          npm install

          npm install @capacitor-community/admob@6

          npx cap add android

          if [ -f scripts/patch-android.js ]; then
            node scripts/patch-android.js
          fi

          npx cap sync android

          python3 -c '
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          c = p.read_text(encoding="utf-8")

          admob = """        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6630383601701998~1024264367"/>
          """

          if "com.google.android.gms.ads.APPLICATION_ID" not in c:
              c = c.replace("</application>", admob + "    </application>")
              p.write_text(c, encoding="utf-8")

          print("AdMob configuration complete")
          '

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          cd android
          chmod +x gradlew

          ./gradlew assembleRelease

          ls -lh app/build/outputs/apk/release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gh release create v1.0.0 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            --title "Rafiq Al-Muslim v1.0.0" \
            --notes "Rafiq Al-Muslim Android APK"
